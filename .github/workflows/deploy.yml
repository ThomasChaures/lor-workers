name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-deploys from the Actions tab

# Never let two deploys run at once (a reload mid-reload leaves PM2 confused).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Secrets are forwarded to the remote shell via `envs` below — NOT
          # interpolated into the script string, so they never appear in logs.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,RIOT_API_KEY
          script: |
            set -euo pipefail  # NOTE: never add -x here, it would leak secrets

            # nvm-installed node/pm2 are NOT on PATH in a non-interactive SSH
            # shell — this line is the #1 thing people forget. Source nvm first.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_DIR="$HOME/lor-u"
            cd "$APP_DIR"

            # The VPS clone is a PURE deploy target: it must always mirror
            # origin/main exactly and never carry local commits. Hard reset makes
            # deploys deterministic and immune to "pull failed: local changes".
            git fetch --prune origin
            git reset --hard origin/main

            # Regenerate .env on every deploy — single source of truth. Secrets
            # come from the forwarded env vars (heredoc doesn't echo, chmod 600
            # locks it down). RIOT_REGION_ROUTING/RIOT_PLATFORM are config, NOT
            # secrets: BR, LAN and LAS all route to "americas" for match-v5, and
            # the per-player platform is stored on each profile — this la2 is only
            # a fallback the sync path never actually uses. Tuning vars
            # (SYNC_INTERVAL_MS/SYNC_STALE_MS) are omitted; env.ts has defaults.
            cat > .env <<EOF
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            RIOT_API_KEY=${RIOT_API_KEY}
            RIOT_REGION_ROUTING=americas
            RIOT_PLATFORM=la2
            EOF
            chmod 600 .env

            npm ci
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
